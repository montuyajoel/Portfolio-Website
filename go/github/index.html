<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting to GitHub…</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta http-equiv="refresh" content="2;url=https://github.com/montuyajoel" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      background: #0a0a12;
      color: #c8c8d4;
    }
  </style>
</head>
<body>
  <p>Opening GitHub…</p>
  <script>
    // Let Web Analytics record this pageview, then continue.
    window.addEventListener('load', function () {
      setTimeout(function () {
        location.replace('https://github.com/montuyajoel');
      }, 400);
    });
  </script>
</body>
</html>
